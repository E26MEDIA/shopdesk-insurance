name: Desktop checks

on:
  pull_request:
    paths:
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "server/**"
      - ".github/workflows/desktop-checks.yml"
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "server/**"
      - ".github/workflows/desktop-checks.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run desktop unit tests
        run: node --test electron/*.test.cjs scripts/*.test.cjs server/*.test.cjs
