name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "resources/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "resources/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Insurance Desk Windows installer
        run: npm run desktop:dist:win -- --publish never

      - name: Verify desktop package
        run: node scripts/verify-desktop-package.cjs

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          echo "value=$ver" >> $env:GITHUB_OUTPUT

      - name: Verify installer size (must be full build)
        shell: pwsh
        run: |
          $exe = "dist-desktop/ShopDesk-Setup-${{ steps.version.outputs.value }}.exe"
          $zip = "dist-desktop/ShopDesk-Setup-${{ steps.version.outputs.value }}.zip"
          $size = (Get-Item $exe).Length
          if ($size -lt 50MB) { throw "Installer too small ($size bytes) — broken build" }
          if (-not (Test-Path $zip)) { throw "Missing $zip — builder should wrap the NSIS installer" }
          Write-Host "Installer OK: $([math]::Round($size/1MB, 1)) MB"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopDesk-Windows-installer
          path: |
            dist-desktop/ShopDesk-Setup-*.exe
            dist-desktop/ShopDesk-Setup-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Vercel Blob (fast CDN)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: npm install @vercel/blob && node scripts/upload-installer-blob.mjs

      - name: Create GitHub Release (team backup)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Insurance Desk ${{ steps.version.outputs.value }}
          body: Insurance Desk Windows installer (upload the .zip to Dropbox for customers — repo is private)
          files: |
            dist-desktop/ShopDesk-Setup-${{ steps.version.outputs.value }}.exe
            dist-desktop/ShopDesk-Setup-${{ steps.version.outputs.value }}.zip
          make_latest: true
          overwrite_files: true
