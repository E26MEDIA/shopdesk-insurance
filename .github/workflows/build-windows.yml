name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ShopDesk Windows installer
        run: npm run desktop:dist:win -- --publish never

      - name: Verify desktop package
        run: node scripts/verify-desktop-package.cjs

      - name: Verify installer size (must be full build)
        shell: pwsh
        run: |
          $size = (Get-Item dist-desktop/ShopDesk-Setup-0.1.0.exe).Length
          if ($size -lt 50MB) { throw "Installer too small ($size bytes) — broken build" }
          Write-Host "Installer OK: $([math]::Round($size/1MB, 1)) MB"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShopDesk-Setup-0.1.0.exe
          path: dist-desktop/ShopDesk-Setup-0.1.0.exe
          if-no-files-found: error

      - name: Upload to Vercel Blob (fast CDN)
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: npm install @vercel/blob && node scripts/upload-installer-blob.mjs

      - name: Create GitHub Release (team backup)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: ShopDesk 0.1.0
          body: Insurance Desk Windows installer (team download only — repo is private)
          files: dist-desktop/ShopDesk-Setup-0.1.0.exe
          make_latest: true
          overwrite_files: true
